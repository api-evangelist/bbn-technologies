name: BBN Technologies
description: >-
  BBN Technologies is a research and development organization founded in 1948
  (originally Bolt Beranek and Newman) and now operating as RTX BBN Technologies,
  a division of RTX (Raytheon). BBN is historically notable for pioneering the
  ARPANET, early network email, and packet-switched networking, and today
  conducts advanced defense and intelligence R&D across AI/machine learning,
  command and control, cyber operations, signal processing and spectrum,
  networking, quantum and photonics, and voice and language technologies. BBN
  serves government and defense customers and does not publish a public developer
  portal, API, or SDK surface; this profile is maintained for network identity
  and discovery only.
